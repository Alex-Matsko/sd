# "Connection: upgrade" only for requests that actually asked to upgrade;
# a plain HTTP request must keep its own Connection header, so this can't be
# a constant. Lives here because `map` is only valid at http level - the file
# is included into nginx's http block by the default conf.d layout.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50m;

    # Docker's embedded DNS (127.0.0.11) resolves `app` to its current
    # container IP. Using a variable in proxy_pass forces nginx to re-resolve
    # on this schedule instead of caching the IP for the life of the nginx
    # process - otherwise rebuilding/recreating the app container (a new IP)
    # leaves nginx returning 502 until nginx itself is restarted.
    resolver 127.0.0.11 valid=10s;
    set $upstream_app app:8000;

    location / {
        proxy_pass http://$upstream_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade for /ws/notifications (ТЗ р. 8). Without these
        # three lines nginx answers the handshake with a plain 200 and the
        # socket never opens - and the failure only shows through the proxy,
        # never when hitting the app container directly.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # A websocket is idle by design; the default 60s read timeout would
        # tear it down between notifications.
        proxy_read_timeout 3600s;
    }
}
