services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sd}
      POSTGRES_DB: ${POSTGRES_DB:-sd}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sd}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sd}:${POSTGRES_PASSWORD:-sd}@db:5432/${POSTGRES_DB:-sd}
    volumes:
      - attachments:/data/attachments
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  worker:
    build: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker_health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sd}:${POSTGRES_PASSWORD:-sd}@db:5432/${POSTGRES_DB:-sd}
    volumes:
      - attachments:/data/attachments
    depends_on:
      app:
        condition: service_healthy

  watchdog:
    build: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.watchdog"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sd}:${POSTGRES_PASSWORD:-sd}@db:5432/${POSTGRES_DB:-sd}
    volumes:
      - attachments:/data/attachments
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; assert time.time()-os.stat('/tmp/sd-watchdog-heartbeat').st_mtime < 60"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  # Static SPA build, served by its own nginx on a separate port - kept
  # separate from the API's nginx above rather than merged onto the same
  # port, because the backend's routers all live at root paths (/tickets,
  # /users, ...) with no /api prefix, which would collide with the SPA's own
  # client-side routes of the same names (see docs/decisions.md).
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${FRONTEND_API_BASE_URL:-/api}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    depends_on:
      app:
        condition: service_healthy
      nginx:
        condition: service_started

volumes:
  db_data:
  attachments:
