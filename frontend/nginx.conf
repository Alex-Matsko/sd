server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: React Router owns client-side routes like /tickets/123 -
    # any path not matching a real static file serves index.html so a
    # hard refresh/direct link doesn't 404 at nginx before React Router
    # ever sees the URL.
    location / {
        try_files $uri /index.html;
    }
}
