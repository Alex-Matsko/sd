# Connection: upgrade — только для запросов, которые его просили (WebSocket
# уведомлений); map допустим лишь на уровне http, а conf.d включается туда.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: React Router owns client-side routes like /tickets/123 -
    # any path not matching a real static file serves index.html so a
    # hard refresh/direct link doesn't 404 at nginx before React Router
    # ever sees the URL.
    # Заголовки безопасности. Без них панель сотрудника и личный кабинет
    # клиента открывались в чужом iframe — то есть кликджекинг был возможен
    # на обеих страницах.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # connect-src оставлен широким намеренно: адрес API задаётся при сборке
    # (FRONTEND_API_BASE_URL) и на каждой установке свой, а зашитый сюда
    # список молча ломал бы панель у заказчика с другим доменом.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; connect-src *; frame-ancestors 'none'" always;

    # /api/ — API на том же домене, что и панель (FRONTEND_API_BASE_URL=/api):
    # снаружи панель открывается через обратный прокси по https, и адрес
    # API во внутренней сети браузеру недоступен. Запрос уходит в nginx API
    # без префикса /api. Переменная в proxy_pass — чтобы адрес контейнера
    # перечитывался после его пересоздания, а не держался до перезапуска.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $upstream_api nginx:80;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        client_max_body_size 50m;
    }

    # PDF.js ships its worker as an ES module; nginx's default MIME list
    # does not recognize .mjs, which browsers refuse as an octet stream.
    location ~ \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
